# modprobe config for the out-of-tree rtw8922au (RTL8922AU / rtw89 WiFi 7
# USB) driver.
#
# Only blacklist the in-tree rtw89 core/usb/8922a modules this recipe
# duplicates, so the out-of-tree _git modules always win for the one chip
# they exist for. Every other rtw89 chip (8851b*, 8852a*, 8852b*, 8852c*) is
# deliberately left alone -- those are handled by the in-tree driver and
# must keep loading normally.

options rtw89_usb_git switch_usb_mode=y

blacklist rtw89_core
blacklist rtw89_8922a
blacklist rtw89_usb
