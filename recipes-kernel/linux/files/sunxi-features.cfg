# linux-mainline (meta-sunxi) kernel feature gaps vs. beaglebone's
# makeitwork.cfg (meta-beagleboard/recipes-kernel/linux/files/makeitwork.cfg),
# scoped to what's actually needed for this project's use of these boards:
# containers (cgroups/namespaces -- podman needs USER_NS in particular), USB
# WiFi dongles, and userspace/disk crypto. Applies to every meta-sunxi
# machine building linux-mainline, not just one board. KVM is not included:
# checked the real kernel tree (linux-mainline 6.6.85) and mainline Linux
# has dropped 32-bit ARM KVM *host* support entirely -- there is no
# arch/arm/kvm directory and no CONFIG_KVM Kconfig symbol reachable for
# arch/arm at all, regardless of Cortex-A7 having the silicon extensions.

# Filesystems
CONFIG_SQUASHFS=y
# ZRAM's Kconfig is "depends on CRYPTO_LZO || CRYPTO_ZSTD || CRYPTO_LZ4 ||
# CRYPTO_LZ4HC || CRYPTO_842" -- none of those were enabled anywhere else in
# this defconfig, so CONFIG_ZRAM=y alone was silently dropped by Kconfig's
# dependency resolution (confirmed: it doesn't appear in the merged .config
# at all, not even as "# CONFIG_ZRAM is not set"). The *_BACKEND_* symbols
# below are ZRAM's own backend-choice children, not the crypto deps -- both
# halves are required.
CONFIG_CRYPTO_LZO=y
CONFIG_CRYPTO_ZSTD=y
CONFIG_CRYPTO_LZ4=y
CONFIG_ZRAM=y
CONFIG_ZRAM_BACKEND_LZ4=y
CONFIG_ZRAM_BACKEND_ZSTD=y
CONFIG_ZRAM_BACKEND_LZO=y
CONFIG_ZRAM_WRITEBACK=y
CONFIG_ZRAM_MULTI_COMP=y

# Crypto (CRYPTO_XTS matters for dm-crypt/LUKS; the rest are the same
# legacy/compat + userspace crypto API set makeitwork.cfg turns on)
CONFIG_CRYPTO_XTS=y
CONFIG_CRYPTO_ARC4=y
CONFIG_CRYPTO_DES=y
CONFIG_CRYPTO_MD4=y
CONFIG_CRYPTO_USER_API_AEAD=y
CONFIG_CRYPTO_USER_API_HASH=y
CONFIG_CRYPTO_USER_API_SKCIPHER=y
CONFIG_KEY_DH_OPERATIONS=y
CONFIG_PKCS8_PRIVATE_KEY_PARSER=y

# USB WiFi -- same Realtek chip family list as makeitwork.cfg; cfg80211/
# mac80211/WLAN are already enabled in the mainline defconfig, this board
# was just missing the actual chip drivers for the same class of dongle
# beaglebone targets.
CONFIG_WLAN_VENDOR_REALTEK=y
CONFIG_RTL8XXXU=m
CONFIG_RTL8180=m
CONFIG_RTL8187=m
CONFIG_RTL8192CE=m
CONFIG_RTL8192SE=m
CONFIG_RTL8192DE=m
CONFIG_RTL8723AE=m
CONFIG_RTL8723BE=m
CONFIG_RTL8188EE=m
CONFIG_RTL8192EE=m
CONFIG_RTL8821AE=m
CONFIG_RTL8192CU=m
CONFIG_RTL8192DU=m
CONFIG_RTLLIB=m
CONFIG_RTL8723BS=m
CONFIG_RTW88=y
CONFIG_RTW88_8723DU=m
CONFIG_RTW88_8822BE=m
CONFIG_RTW88_8822BS=m
CONFIG_RTW88_8822BU=m
CONFIG_RTW88_8822CE=m
CONFIG_RTW88_8822CS=m
CONFIG_RTW88_8822CU=m
CONFIG_RTW88_8723DE=m
CONFIG_RTW88_8723DS=m
CONFIG_RTW88_8723CS=m
CONFIG_RTW88_8821CE=m
CONFIG_RTW88_8821CS=m
CONFIG_RTW88_8821CU=m
CONFIG_RTW89=y
CONFIG_RTW89_8922AE=m
CONFIG_RTW89_8851BE=m
CONFIG_RTW89_8852AE=m
CONFIG_RTW89_8852BE=m
CONFIG_RTW89_8852BTE=m
CONFIG_RTW89_8852CE=m
CONFIG_RTW89_8851BU=m
CONFIG_RTW89_8852AU=m
CONFIG_RTW89_8852BU=m
CONFIG_RTW89_8852CU=m

# Cgroups -- this project builds podman for its machines; rootless
# container support needs USER_NS (see Namespaces below) plus this set.
CONFIG_MEMCG=y
CONFIG_BLK_CGROUP=y
CONFIG_CGROUP_SCHED=y
CONFIG_CFS_BANDWIDTH=y
CONFIG_RT_GROUP_SCHED=y
CONFIG_CGROUP_PIDS=y
CONFIG_CGROUP_RDMA=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CPUSETS=y
CONFIG_CPUSETS_V1=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_CGROUP_PERF=y
CONFIG_CGROUP_MISC=y
CONFIG_CGROUP_BPF=y

# Namespaces -- USER_NS is the one this board was actually missing;
# everything else namespaces-related already matched beaglebone.
CONFIG_USER_NS=y

# Networking
CONFIG_WIREGUARD=y
CONFIG_NET_SCH_CAKE=y
CONFIG_BIG_KEYS=y
